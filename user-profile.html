<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apply | Applicant Management System</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">

</head>

<body class="dashboard-page">

    <div class="dashboard">

        <!-- Sidebar -->

        <aside class="sidebar">

            <div class="logo">
                <i class="ri-user-line"></i>
                <span>AMS</span>
            </div>

            <ul class="menu">

                <li>
                    <a href="user.html">
                        <i class="ri-dashboard-line"></i>
                        <span>Dashboard</span>
                    </a>
                </li>

                <li class="active">
                    <a href="apply.html">
                        <i class="ri-file-add-line"></i>
                        <span>Apply</span>
                    </a>
                </li>

                <li>
                    <a href="status.html">
                        <i class="ri-file-search-line"></i>
                        <span>Application Status</span>
                    </a>
                </li>

                <li>
                    <a href="user-profile.html">
                        <i class="ri-user-line"></i>
                        <span>My Profile</span>
                    </a>
                </li>

                <li>
                    <a href="#" id="logoutBtn">
                        <i class="ri-logout-box-r-line"></i>
                        <span>Logout</span>
                    </a>
                </li>

            </ul>

        </aside>

        <!-- Main Content -->

        <main class="main-content">

            <!-- Topbar -->

            <header class="topbar">

                <div>
                    <h2>Apply for a Position</h2>
                    <small>Complete the form below to submit your application.</small>
                </div>

                <div class="admin-profile">

                    <div class="admin-info">

                        <i class="ri-user-3-line"></i>

                        <div>
                            <strong>Applicant</strong>
                            <small>User</small>
                        </div>

                    </div>

                </div>

            </header>

            <!-- Application Form -->

            <section class="table-section">

                <div class="table-header">
                    <h3>Application Form</h3>
                </div>

                <form id="applicationForm">

                    <div class="form-group">

                        <label>Position Applying For</label>

                        <select id="position" required>
                            <option value="">Select Position</option>
                            <option>Web Developer</option>
                            <option>Frontend Developer</option>
                            <option>Backend Developer</option>
                            <option>System Analyst</option>
                            <option>Network Administrator</option>
                            <option>Technical Support</option>
                        </select>

                    </div>

                    <div class="form-group">

                        <label>Company</label>

                        <select id="company" required>
                            <option value="">Select Company</option>
                            <option>Moderntech Computer Systems Inc.</option>
                            <option>ABC Corporation</option>
                            <option>XYZ Technologies</option>
                        </select>

                    </div>

                    <div class="form-group">

                        <label>Resume</label>

                        <input type="file" id="resume" accept=".pdf,.doc,.docx" required>

                    </div>

                    <div class="form-group">

                        <label>Cover Letter</label>

                        <input type="file" id="coverLetter" accept=".pdf,.doc,.docx">

                    </div>

                    <button type="submit" class="btn-primary">
                        Submit Application
                    </button>

                </form>

            </section>

        </main>

    </div>

    <script type="module" src="./scripts/apply.js"></script>

</body>

</html>
