<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Applicant | Applicant Management System</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
</head>

<body class="dashboard-page">

<div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">
            <i class="ri-user-star-line"></i>
            <span>AMS</span>
        </div>

        <ul class="menu">
            <li>
                <a href="dashboard.html">
                    <i class="ri-dashboard-line"></i>
                    <span>Dashboard</span>
                </a>
            </li>

            <li class="active">
                <a href="applicants.html">
                    <i class="ri-user-3-line"></i>
                    <span>Applicants</span>
                </a>
            </li>

            <li>
                <a href="profile.html">
                    <i class="ri-user-settings-line"></i>
                    <span>Profile</span>
                </a>
            </li>

            <li>
                <a href="settings.html">
                    <i class="ri-settings-3-line"></i>
                    <span>Settings</span>
                </a>
            </li>

            <li>
                <a href="#" id="logoutBtn">
                    <i class="ri-logout-box-r-line"></i>
                    <span>Logout</span>
                </a>
            </li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <!-- Topbar -->
        <header class="topbar">
            <div>
                <h2>Add Applicant</h2>
                <small>Create new applicant record</small>
            </div>

            <div class="admin-profile">
                <div class="notification">
                    <i class="ri-notification-3-line"></i>
                </div>

                <div class="admin-info">
                    <i class="ri-admin-line"></i>
                    <div>
                        <strong>Admin</strong>
                        <small>Administrator</small>
                    </div>
                </div>
            </div>
        </header>

        <!-- Add Applicant Form -->
        <section class="form-section">
            <div class="form-card">

                <div class="form-header">
                    <h3>Applicant Information</h3>
                    <a href="applicants.html">
                        <i class="ri-arrow-left-line"></i>
                        Back
                    </a>
                </div>

                <form id="applicantForm">

                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="name" placeholder="Enter full name" required>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="email" placeholder="Enter email address" required>
                    </div>

                    <div class="form-group">
                        <label>Contact Number</label>
                        <input type="text" id="contact" placeholder="Enter contact number" required>
                    </div>

                    <div class="form-group">
                        <label>Position Applied</label>
                        <input type="text" id="position" placeholder="Enter position applied" required>
                    </div>

                    <div class="form-group">
                        <label>Status</label>
                        <select id="status">
                            <option value="Pending">Pending</option>
                            <option value="Interview">Interview</option>
                            <option value="Hired">Hired</option>
                            <option value="Rejected">Rejected</option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <a href="applicants.html" class="cancel-btn">Cancel</a>
                        <button type="submit">Save Applicant</button>
                    </div>

                </form>

            </div>
        </section>

    </main>

</div>

<script type="module" src="./scripts/add-applicant.js"></script>

</body>
</html>
