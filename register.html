<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Applicant Management System</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
</head>

<body>

    <div class="login-page">
        <div class="login-container">

            <!-- LEFT PANEL -->
            <div class="left-panel">

                <div class="logo">
                    <i class="ri-user-star-line"></i>
                    <span>Applicant Management System</span>
                </div>

                <h1>Create Account</h1>
                <p>Fill in the required information below to create your applicant account.</p>

                <form id="registerForm">

                    <div class="input-group">
                        <label>Full Name</label>
                        <input type="text" id="fullName" placeholder="Juan Dela Cruz" required>
                    </div>

                    <div class="input-group">
                        <label>Email Address</label>
                        <input type="email" id="email" placeholder="example@email.com" required>
                    </div>

                    <div class="input-group">
                        <label>Username</label>
                        <input type="text" id="username" placeholder="Choose a username" required>
                    </div>

                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="password" placeholder="Enter password" required>

                        <div class="show-password">
                            <input type="checkbox" id="showPassword">
                            <label for="showPassword">Show Password</label>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Confirm Password</label>
                        <input type="password" id="confirmPassword" placeholder="Confirm password" required>

                        <div class="show-password">
                            <input type="checkbox" id="showConfirmPassword">
                            <label for="showConfirmPassword">Show Password</label>
                        </div>
                    </div>

                    <button type="submit" class="login-btn">Create Account</button>

                </form>

                <div class="divider">
                    <span>OR</span>
                </div>

                <button type="button" id="googleRegisterBtn" class="google-btn">
                    <img src="image/google.png" alt="Google">
                    <span>Continue with Google</span>
                </button>

                <p class="register">
                    Already have an account?
                    <a href="index.html">Sign In</a>
                </p>

            </div>

            <!-- RIGHT PANEL -->
            <div class="right-panel"></div>

        </div>
    </div>

    <script type="module" src="scripts/script.js"></script>

</body>
</html>
